openapi: 3.1.0
info:
  title: SocialNet API
  version: 1.0.0
  description: |
    Social network API built in Go.

    **Lab coverage:**
    - **L1** – DB schema: Users, Friendships (M:N), Posts, Comments, Likes, QueryLogs
    - **L2** – ORM CRUD via GORM (posts, comments, likes, friends)
    - **L3** – Post search & filtering with composite indexes
    - **L4** – JWT authentication, bcrypt passwords, parameterised queries, request logging

servers:
  - url: http://localhost:8080

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }

    TokenResponse:
      type: object
      properties:
        token: { type: string }
        user_id: { type: integer }

    User:
      type: object
      properties:
        id: { type: integer }
        username: { type: string }
        email: { type: string }
        created_at: { type: string, format: date-time }

    Post:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        content: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Comment:
      type: object
      properties:
        id: { type: integer }
        post_id: { type: integer }
        user_id: { type: integer }
        user: { $ref: '#/components/schemas/User' }
        content: { type: string }
        created_at: { type: string, format: date-time }

    PostList:
      type: object
      properties:
        posts:
          type: array
          items: { $ref: '#/components/schemas/Post' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

    QueryLog:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer, nullable: true }
        method: { type: string }
        path: { type: string }
        duration_ms: { type: integer }
        status: { type: integer }
        created_at: { type: string, format: date-time }

    LogList:
      type: object
      properties:
        logs:
          type: array
          items: { $ref: '#/components/schemas/QueryLog' }
        total: { type: integer }
        page: { type: integer }
        limit: { type: integer }

security:
  - bearerAuth: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, email, password]
              properties:
                username: { type: string, example: alice }
                email: { type: string, format: email, example: alice@example.com }
                password: { type: string, minLength: 6, example: secret123 }
      responses:
        '201':
          description: Created — returns JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400': { description: Bad request }
        '409': { description: Username or email already taken }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: alice@example.com }
                password: { type: string, example: secret123 }
      responses:
        '200':
          description: OK — returns JWT
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '401': { description: Invalid credentials }

  /posts:
    get:
      tags: [Posts]
      summary: List / search posts (L3 — indexed search & filter)
      parameters:
        - name: q
          in: query
          description: Full-text search in post content
          schema: { type: string }
        - name: author_id
          in: query
          description: Filter by author user ID
          schema: { type: integer }
        - name: from
          in: query
          description: Created on or after this date (YYYY-MM-DD)
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Created on or before this date (YYYY-MM-DD)
          schema: { type: string, format: date }
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: limit
          in: query
          schema: { type: integer, default: 20, maximum: 100 }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostList' }

    post:
      tags: [Posts]
      summary: Create a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, example: Hello world! }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }

  /posts/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }

    get:
      tags: [Posts]
      summary: Get a post by ID
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '404': { description: Not found }

    put:
      tags: [Posts]
      summary: Update a post (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Post' }
        '403': { description: Forbidden }
        '404': { description: Not found }

    delete:
      tags: [Posts]
      summary: Delete a post (owner only)
      responses:
        '204': { description: Deleted }
        '403': { description: Forbidden }
        '404': { description: Not found }

  /posts/{id}/comments:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }

    get:
      tags: [Comments]
      summary: List comments on a post
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Comment' }

    post:
      tags: [Comments]
      summary: Add a comment to a post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string, example: Great post! }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '404': { description: Post not found }

  /posts/{id}/like:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer } }

    post:
      tags: [Likes]
      summary: Like a post
      responses:
        '204': { description: Liked }
        '409': { description: Already liked }

    delete:
      tags: [Likes]
      summary: Unlike a post
      responses:
        '204': { description: Unliked }

  /me/friends:
    get:
      tags: [Friends]
      summary: List current user's friends
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/User' }

  /me/friends/{fid}:
    parameters:
      - { name: fid, in: path, required: true, schema: { type: integer }, description: Target user ID }

    post:
      tags: [Friends]
      summary: Add a friend
      responses:
        '204': { description: Added }
        '400': { description: Invalid or self-reference }
        '404': { description: User not found }
        '409': { description: Already friends }

    delete:
      tags: [Friends]
      summary: Remove a friend
      responses:
        '204': { description: Removed }

  /admin/logs:
    get:
      tags: [Admin]
      summary: View request logs (L4 — monitoring interface)
      parameters:
        - { name: page, in: query, schema: { type: integer, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, default: 50, maximum: 200 } }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LogList' }
