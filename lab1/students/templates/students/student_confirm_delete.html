{% extends "students/base.html" %}
{% block title %}Видалити студента{% endblock %}
{% block content %}
<div class="card" style="max-width:500px;">
  <div class="card-body">
    <h4>Підтвердження видалення</h4>
    <p>Ви впевнені, що хочете видалити <strong>{{ student.full_name }}</strong>?</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Так, видалити</button>
      <a href="{% url 'student_list' %}" class="btn btn-secondary">Скасувати</a>
    </form>
  </div>
</div>
{% endblock %}
