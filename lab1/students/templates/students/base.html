<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Студенти{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background: #f8f9fa; }
    .navbar-brand { font-weight: 700; }
    .table th { background: #343a40; color: #fff; }
  </style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'student_list' %}">Студенти</a>
    <div class="collapse navbar-collapse">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="{% url 'student_list' %}">Список</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'student_add' %}">Додати</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'import_csv' %}">Імпорт CSV</a></li>
        <li class="nav-item"><a class="nav-link" href="{% url 'report' %}">Звіт</a></li>
        <li class="nav-item"><a class="nav-link" href="/admin/">Адмін</a></li>
      </ul>
    </div>
  </div>
</nav>
<div class="container">
  {% for msg in messages %}
    <div class="alert alert-{{ msg.tags|default:'info' }} alert-dismissible fade show" role="alert">
      {{ msg }} <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
  {% endfor %}
  {% block content %}{% endblock %}
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
